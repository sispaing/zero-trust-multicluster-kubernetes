server {
  listen 8080;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  # Calls to the backend leave through the Envoy sidecar (mTLS + identity kanban-ui).
  location /api/ {
    proxy_pass http://kanban-app.kanban.svc.cluster.local:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
